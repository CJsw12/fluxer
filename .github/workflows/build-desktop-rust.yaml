name: Build Rust Native Desktop (Fluxer)

on:
  push:
    branches:
      - main
      - desktop-rs
    tags:
      - 'v*'
    paths:
      - 'fluxer_desktop_rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-desktop-rust.yaml'
  pull_request:
    branches:
      - main
      - desktop-rs
    paths:
      - 'fluxer_desktop_rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-desktop-rust.yaml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Custom tag name for release (optional, e.g. v0.1.0-preview)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Native Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run unit tests
        run: cargo test -p fluxer_desktop_rs --verbose

      - name: Build optimized release binary
        run: |
          cargo build --release -p fluxer_desktop_rs
          New-Item -ItemType Directory -Path "target/dist" -Force
          Copy-Item target/release/fluxer.exe target/dist/Fluxer.exe -Force
          Compress-Archive -Path target/release/fluxer.exe -DestinationPath target/dist/fluxer-windows-x64.zip -Force

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer-Windows-x64
          path: |
            target/dist/Fluxer.exe
            target/dist/fluxer-windows-x64.zip
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_info
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $is_prerelease = "false"
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            $tag = "${{ inputs.release_tag }}"
            $is_prerelease = "true"
          } else {
            $tag = "desktop-rs-latest"
            $is_prerelease = "true"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "is_prerelease=$is_prerelease" >> $env:GITHUB_OUTPUT

      - name: Publish or Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Fluxer Desktop (Rust) ${{ steps.release_info.outputs.tag }}"
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            target/dist/Fluxer.exe
            target/dist/fluxer-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
