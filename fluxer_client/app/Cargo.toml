[package]
name = "fluxer_client_app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fluxer_client"
path = "src/main.rs"

[dependencies]
fluxer_client_core = { path = "../core" }
# Official Fluxer Lingui catalogs (44 locales) for the UI.
fluxer_client_i18n = { path = "../i18n" }
# Fluxer message markdown (Fluxer parser + TextView rendering, mentions, spoilers).
fluxer_client_markdown = { path = "../markdown" }
gpui-kit = "=0.10.0"
anyhow = "1"
base64 = "0.22"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "io-util", "process"] }
url = "2.5"
tracing = "0.1"
# Local time for message timestamps (already in the lockfile via gpui).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# HTTP client for gpui `img()` (attachment previews, avatars); same version and
# TLS setup (rustls + platform verifier) as fluxer_client_core.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# In-memory attachment bodies (`UploadSource::Bytes`); same crate as core.
bytes = "1"
# Image frame construction for GPUI RenderImage (live video viewer).
image = { version = "0.25", default-features = false }
# Desktop toasts (Windows: WinRT toast via tauri-winrt-notification).
notify-rust = "4.19"
# Message sounds (bundled mp3/ogg from fluxer_app/src/media/sounds).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "vorbis"] }
# OS audio input/output device enumeration (already in Cargo.lock via rodio).
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
# System tray icon and HKCU Run autostart registry access (cached locally).
tray-icon = { version = "0.20", default-features = false }
windows-registry = "0.6.1"
# Win32 AUMID, Start menu shortcut and fatal-error dialog. The version is the
# copy already in the lockfile (transitive via gpui-pre).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Icon + VERSIONINFO embedding; also already in the lockfile (gpui-pre).
embed-resource = "3.0"

[dev-dependencies]
# Headless UI tests (TestAppContext, #[gpui_kit::test]). Same pin as gpui-kit's
# gpui-pre; gpui-kit's own test-support feature is not used because it pulls
# gpui-fast-platform and a conflicting wgpu (see tools/gpui_kit_spike).
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
