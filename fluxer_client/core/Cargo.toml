[package]
name = "fluxer_client_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
bytes = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
url = "2.5"
zstd = "0.13"
rand = "0.9"
tracing = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
httpdate = "1"
base64 = "0.22"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
hmac = "0.12"
tempfile = "3"
insta = { version = "1", features = ["json"] }
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "test-util"] }
