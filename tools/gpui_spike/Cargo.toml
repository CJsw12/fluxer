# Standalone workspace (see fluxer_desktop_rs/Cargo.toml: gpui pins core-foundation =0.10.0).
[workspace]

[package]
name = "gpui_spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = "0.2.2"
anyhow = "1.0"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
